<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #43cea2, #185a9d);
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 40px;
            background: rgba(0,0,0,0.2);
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            text-align: center;
            margin-top: 100px;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card {
            background: white;
            color: black;
            width: 250px;
            margin: 15px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #43cea2;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }

        .btn:hover {
            background: #2bbf8a;
        }

        @media (max-width: 768px) {
            .card-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Dashboard 🎯</h2>
    <a href="/" style="color:white; text-decoration:none;">Home</a>
</div>

<!-- Content -->
<div class="container">
    <h1>Welcome to your Dashboard</h1>
    <p>Manage your quizzes or explore new ones</p>

    <div class="card-container">

        <div class="card">
            <h3>Create Quiz</h3>
            <p>Build your own quiz with questions and answers</p>
            <a href="/create_quiz" class="btn">Create</a>
        </div>

        <div class="card">
            <h3>View Quizzes</h3>
            <p>Browse and attempt available quizzes</p>
            <a href="/quiz_list" class="btn">Explore</a>
        </div>

    </div>
</div>

</body>
</html>
